name: Build OrangeFox (a15)

on:
  workflow_dispatch:
    inputs:
      tree_url:
        description: Device tree repository
        required: true
        default: https://github.com/poqdavid/android_device_samsung_a15
      tree_ref:
        description: Device tree branch, tag or commit
        required: true
        default: fox_12.1
      firmware:
        description: Firmware set (One UI generation) to build; all = every set in the tree
        type: choice
        options: [all, oneui7, oneui6]
        default: all
      build_type:
        description: FOX_BUILD_TYPE (Alpha/Beta/Stable are for the official maintainer only)
        type: choice
        options: [Unofficial, Alpha, Beta, Stable]
        default: Unofficial
      patch_version:
        description: FOX_MAINTAINER_PATCH_VERSION (empty = value from vendorsetup.sh)
        required: false
        default: ""
      draft_release:
        description: Attach the files to a draft GitHub release
        type: boolean
        default: false

permissions:
  contents: write

env:
  FOX_BRANCH: "12.1"
  DEVICE: a15
  DEVICE_PATH: device/samsung/a15

jobs:
  # Resolves the tree ref once, so every set builds the same commit, and
  # lists the sets to build: each is a build of its own (see the tree's
  # firmware/firmware.mk). Only commits and trees are fetched, not the
  # prebuilts.
  sets:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.tree.outputs.commit }}
      sets: ${{ steps.tree.outputs.sets }}
    steps:
      - name: Resolve the tree and its firmware sets
        id: tree
        env:
          TREE_URL: ${{ inputs.tree_url }}
          TREE_REF: ${{ inputs.tree_ref }}
          FIRMWARE: ${{ inputs.firmware }}
        run: |
          git clone --quiet --no-checkout --filter=blob:none "$TREE_URL" tree
          cd tree
          # a branch or tag is fetched by name; a (short) commit is already in the clone
          if git fetch --quiet origin "$TREE_REF"; then
            commit=$(git rev-parse FETCH_HEAD)
          else
            commit=$(git rev-parse --verify "$TREE_REF^{commit}")
          fi
          git log -1 --format='%H %s' "$commit"
          mapfile -t have < <(git ls-tree -r --name-only "$commit" -- firmware |
            sed -n 's|^firmware/\([a-z0-9_]*\)/firmware\.mk$|\1|p')
          if [ "${#have[@]}" -eq 0 ]; then
            # a tree from before the firmware sets: one build of its own prebuilts
            if [ "$FIRMWARE" != all ]; then
              echo "::error::$TREE_REF has no firmware sets; build it with firmware: all"
              exit 1
            fi
            sets='[""]'
          elif [ "$FIRMWARE" = all ]; then
            sets=$(printf '%s\n' "${have[@]}" | jq -R . | jq -cs .)
          elif printf '%s\n' "${have[@]}" | grep -qx -- "$FIRMWARE"; then
            sets=$(jq -cn --arg s "$FIRMWARE" '[$s]')
          else
            echo "::error::$TREE_REF has no firmware set $FIRMWARE, only: ${have[*]}"
            exit 1
          fi
          echo "sets: $sets"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "sets=$sets" >> "$GITHUB_OUTPUT"

  build:
    needs: sets
    name: build (${{ matrix.firmware || 'tree' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      # one set failing should not cancel the others
      fail-fast: false
      matrix:
        firmware: ${{ fromJSON(needs.sets.outputs.sets) }}
    env:
      # not FIRMWARE: the environment reaches every makefile of the build
      A15_SET: ${{ matrix.firmware }}
      TREE_COMMIT: ${{ needs.sets.outputs.commit }}
    outputs:
      release_name: ${{ steps.package.outputs.release_name }}
    steps:
      - name: Check out builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Add swap
        run: |
          # keep the swap file off the build disk when the runner has a second one
          sudo swapoff -a || true
          if mountpoint -q /mnt && [ "$(df --output=avail -BG /mnt | tail -n 1 | tr -dc 0-9)" -ge 20 ]; then
            swapfile=/mnt/fox-swap; size=16G
          else
            swapfile=/fox-swap; size=8G
          fi
          sudo fallocate -l "$size" "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
          df -h / /mnt || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          git clone --depth 1 https://gitlab.com/OrangeFox/misc/scripts.git "$RUNNER_TEMP/fox-scripts"
          cd "$RUNNER_TEMP/fox-scripts"
          sudo bash setup/android_build_env.sh
          # Ubuntu 24.04 blocks the unprivileged user namespaces the build sandbox uses
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Sync OrangeFox fox_${{ env.FOX_BRANCH }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git "$RUNNER_TEMP/fox-sync"
          cd "$RUNNER_TEMP/fox-sync"
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$GITHUB_WORKSPACE/fox"

      - name: Clone device tree
        env:
          TREE_URL: ${{ inputs.tree_url }}
          TREE_REF: ${{ inputs.tree_ref }}
        run: |
          git clone --no-checkout "$TREE_URL" "fox/$DEVICE_PATH"
          cd "fox/$DEVICE_PATH"
          # the ref may not be a branch the clone has; the commit is the one
          # the sets job resolved, even if the branch has moved on since
          git fetch --quiet origin "$TREE_REF" || true
          git checkout --detach "$TREE_COMMIT"
          git log -1 --format='%H %s'

      - name: Preflight checks
        run: |
          python3 builder/tools/preflight.py "fox/$DEVICE_PATH" --device "$DEVICE" \
            ${A15_SET:+--firmware "$A15_SET"}

      - name: Build
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          PATCH_VERSION: ${{ inputs.patch_version }}
        run: |
          cd fox
          export FOX_BUILD_DEVICE="$DEVICE"
          # read by the tree's firmware/firmware.mk; a tree from before the
          # firmware sets builds its own prebuilts
          if [ -n "$A15_SET" ]; then export A15_FIRMWARE="$A15_SET"; fi
          if [ "$BUILD_TYPE" != "Unofficial" ]; then export FOX_BUILD_TYPE="$BUILD_TYPE"; fi
          if [ -n "$PATCH_VERSION" ]; then export FOX_MAINTAINER_PATCH_VERSION="$PATCH_VERSION"; fi
          set +eu
          source build/envsetup.sh
          lunch "twrp_${DEVICE}-eng" || exit 1
          set -eo pipefail
          mka adbd recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package
        id: package
        env:
          TREE_URL: ${{ inputs.tree_url }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          out="fox/out/target/product/$DEVICE"
          img=$(find "$out" -maxdepth 4 -name 'OrangeFox-*.img' | head -n 1)
          zip=$(find "$out" -maxdepth 4 -name 'OrangeFox-*.zip' | head -n 1)
          if [ ! -f "$img" ] || [ ! -f "$zip" ]; then
            echo "OrangeFox image or zip missing"; ls -la "$out"; exit 1
          fi
          echo "IMG=$img" >> "$GITHUB_ENV"
          release_name=$(basename "$img" .img)
          # the set goes into the file names: each build only works on its
          # own One UI generation's bootloader
          name=$release_name${A15_SET:+-$A15_SET}
          mkdir -p dist
          cp "$img" "dist/$name.img"
          cp "$zip" "dist/$name.zip"
          # Odin wants recovery.img inside a ustar archive
          cp "$img" "$RUNNER_TEMP/recovery.img"
          tar -H ustar -C "$RUNNER_TEMP" -cf "dist/$name-odin.tar" recovery.img
          (cd dist && sha256sum -- * > SHA256SUMS)
          if [ -n "$A15_SET" ]; then
            mk="fox/$DEVICE_PATH/firmware/$A15_SET/firmware.mk"
            fw_build=$(sed -n 's/^A15_FIRMWARE_BUILD := //p' "$mk")
            fw_os=$(sed -n 's/^A15_FIRMWARE_OS := //p' "$mk")
          fi
          {
            echo "## $name"
            echo
            if [ -n "$A15_SET" ]; then
              echo "- Firmware set: $A15_SET, from $fw_build, for bootloaders with OS letter $fw_os"
            fi
            echo "- Device tree: $TREE_URL @ \`$TREE_COMMIT\`"
            echo "- Manifest: fox_$FOX_BRANCH"
            echo "- Build type: $BUILD_TYPE"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > dist/BUILD_INFO.md
          echo "BUILD_NAME=$name" >> "$GITHUB_ENV"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Check image
        id: check
        continue-on-error: true
        shell: bash
        run: |
          python3 builder/tools/check-image.py "$IMG" "fox/$DEVICE_PATH" \
            ${A15_SET:+--firmware "$A15_SET"} | tee dist/CHECK.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: dist/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log${{ matrix.firmware && format('-{0}', matrix.firmware) || '' }}
          path: build.log
          if-no-files-found: ignore

      - name: Fail on image check
        if: steps.check.outcome == 'failure'
        run: |
          echo "check-image.py reported problems, see CHECK.txt in the artifact"
          exit 1

  # One draft release with every set, only if all of them built and passed
  # check-image.py
  release:
    needs: build
    if: inputs.draft_release
    runs-on: ubuntu-24.04
    steps:
      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          pattern: OrangeFox-*
          path: builds

      - name: Collect the files
        run: |
          mkdir release
          for d in builds/*/; do
            cp "$d"*.img "$d"*.zip "$d"*.tar release/
            cat "$d/BUILD_INFO.md" >> release/BUILD_INFO.md
            echo >> release/BUILD_INFO.md
          done
          (cd release && sha256sum -- *.img *.zip *.tar > SHA256SUMS)
          ls -l release

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ needs.build.outputs.release_name }}
          name: ${{ needs.build.outputs.release_name }}
          body_path: release/BUILD_INFO.md
          files: |
            release/*.img
            release/*.zip
            release/*.tar
            release/SHA256SUMS
